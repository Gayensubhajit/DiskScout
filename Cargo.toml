[package]
name = "diskscout"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.5", features = ["std"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.39"
walkdir = "2"
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
i-slint-backend-testing = "1.17"

[build-dependencies]
slint-build = "1.5"